<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"
    <title>Timofey Androsov</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Libre+Bodoni:wght@500;700&family=Cabin:wght@500;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/></filter></svg>
<div class="table"></div>
<div class="vignette"></div>
<div class="card" id="card">
    <div class="paper" id="paper"></div>
    <a class="phone emb" id="tg" target="_blank" rel="noopener"></a>
    <a class="firm emb" id="gh" target="_blank" rel="noopener"></a>
    <div class="center emb"><div class="name" id="name"></div><div class="role" id="role"></div></div>
    <div class="foot emb"><span id="addr"></span> <a id="mail"></a></div>
    <canvas id="wear" width="1400" height="800"></canvas>
    <canvas id="draw" width="1400" height="800"></canvas>
</div>



<script src="scripts.js"></script>
</body>
</html>
